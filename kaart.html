<!DOCTYPE html>
<!--
  Standalone interactive map. Same engine, same markup, same styles as
  the interactive map at the bottom of index.html — only the sizing is
  overridden so it fills the viewport instead of sitting inside the
  article column.
-->
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bevolkingsevolutie in Europa — Interactieve kaart — VRT NWS</title>
  <link rel="stylesheet" href="assets/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="assets/vendor/nouislider.min.css">
  <link rel="stylesheet" href="article.css">
  <style>
    /* The component (markup + every overlay class) is exactly what
       sits inside index.html's <section class="interactive">; only
       the outer sizing differs. Override .interactive-inline's
       default 80vh / 560px / border styling to fill the viewport. */
    html, body { height: 100%; margin: 0; background: #fff; }
    #interactive-root.interactive-inline {
      height: 100vh;
      width: 100vw;
      min-height: 0;
      border: 0;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div class="interactive-inline" id="interactive-root">
    <div class="interactive-inline__map" data-role="map"></div>
    <div class="interactive-inline__period map-overlay-element">
      <p data-role="period-title">Bevolkingsevolutie in Europa</p>
      <div data-role="year-slider"></div>
      <div class="mode-row" hidden>
        <label><input type="radio" name="mode" value="pct" checked> % verandering</label>
        <label><input type="radio" name="mode" value="abs"> Δ bevolking</label>
      </div>
    </div>
    <div class="interactive-inline__search">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M10.5 4.5a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0 0M16.5 16.5l3.5 3.5" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input
          type="text"
          data-role="search-input"
          placeholder="Zoek je gemeente"
          autocomplete="off"
          spellcheck="false">
      </div>
      <ul data-role="search-results" class="search-results" hidden></ul>
    </div>
    <div data-role="chart-panel" class="interactive-inline__chart map-overlay-element" style="display: none;">
      <p class="info-sentence" data-role="info-sentence"></p>
      <div data-role="popup-chart"></div>
    </div>
    <div class="interactive-inline__legend-wrap">
      <div class="map-overlay-element">
        <div data-role="legend"></div>
        <div class="map-footer">
          Data:
          <a href="https://data.jrc.ec.europa.eu/dataset/37fcacbf-12e2-4b31-b1af-83117a74b2c7" target="_blank" rel="noopener">JRC</a>.
          Kaart:
          <a href="https://protomaps.com" target="_blank" rel="noopener">Protomaps</a> /
          <a href="https://openstreetmap.org" target="_blank" rel="noopener">OSM</a>.
        </div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/maplibre-gl.js"></script>
  <script src="assets/vendor/pmtiles.js"></script>
  <script src="assets/vendor/protomaps-themes-base.js"></script>
  <script src="assets/vendor/d3.min.js"></script>
  <script src="assets/vendor/nouislider.min.js"></script>
  <script type="module">
    import { initInteractiveInline } from "./js/interactive-inline.js";

    // URL parameter overrides — let the embedding iframe pick a
    // specific opening view per page, without needing to redeploy
    // kaart.html. Three shapes supported (first match wins):
    //
    //   ?bbox=west,south,east,north[&padding=30]
    //       Fit-to-bounds. Adapts to container size.
    //       e.g. kaart.html?bbox=2.4,49.4,6.5,51.6
    //
    //   ?lon=4.6&lat=50.6&zoom=7
    //       Fixed centre + zoom.
    //
    //   (no params)
    //       Default = Belgium bounding box.
    const qs = new URLSearchParams(window.location.search);
    let initialView;
    if (qs.has("bbox")) {
      const nums = qs.get("bbox").split(",").map(Number);
      if (nums.length === 4 && nums.every(Number.isFinite)) {
        initialView = {
          bounds: [[nums[0], nums[1]], [nums[2], nums[3]]],
          padding: Number(qs.get("padding")) || 30,
        };
      }
    }
    if (!initialView && qs.has("lon") && qs.has("lat") && qs.has("zoom")) {
      const lon = Number(qs.get("lon"));
      const lat = Number(qs.get("lat"));
      const zoom = Number(qs.get("zoom"));
      if ([lon, lat, zoom].every(Number.isFinite)) {
        initialView = { center: [lon, lat], zoom };
      }
    }
    if (!initialView) {
      initialView = { bounds: [[2.4, 49.4], [6.5, 51.6]], padding: 30 };
    }

    initInteractiveInline({
      rootElement: document.getElementById("interactive-root"),
      initialView,
    }).catch((err) => console.error(err));
  </script>
</body>
</html>
