name: Deploy via SFTP (lftp)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Stap 1: Haal de code op uit de repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Stap 2: Installeer lftp op de GitHub Actions runner
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      # Stap 3: Voer jouw exacte spiegel-commando uit
      - name: Mirror to SFTP via lftp
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "${SFTP_USERNAME},${SFTP_PASSWORD}" sftp://${SFTP_SERVER} -e "
            set sftp:auto-confirm yes;
            mirror --reverse --only-newer --no-perms --verbose --parallel=4 \
              ./ \
              /vrtnws-speeltuin-sftp/2026/europese-populatie/ ;
            bye"